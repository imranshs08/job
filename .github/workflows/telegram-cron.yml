name: Telegram Scheduled Ping

on:
  schedule:
    # Runs at minute 0 past every 6th hour
    # Note: GitHub Actions cron uses UTC time.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allows you to click "Run Workflow" inside GitHub Actions manually

jobs:
  trigger-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Ping Render Webhook (Telegram)
        run: |
          curl -X POST "https://devops-job-bot.onrender.com/cron" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\"}"

      - name: Execute Daily Email Notification (SMTP)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python 14-Telegram-Bot/email_notifier.py --daily
