name: Telegram Scheduled Ping

on:
  schedule:
    # GitHub Actions cron runs in UTC.
    # UTC + 5:30 = IST.
    - cron: "30 2 * * *" # 8:00 AM IST
    - cron: "30 16 * * *" # 10:00 PM IST
  workflow_dispatch:

jobs:
  trigger-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Ping Render Webhook (Telegram)
        run: |
          curl -X POST "https://devops-job-bot.onrender.com/cron" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\"}"

      - name: Execute Notification Engines (Email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_LOGIN: b7e208001@smtp-brevo.com
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq 16 ]; then
            echo "Running Nightly Status Check (10:00 PM IST)"
            python 14-Telegram-Bot/email_notifier.py --nightly
          else
            echo "Running Daily Morning Brief (8:00 AM IST)"
            python 14-Telegram-Bot/email_notifier.py --daily
          fi
