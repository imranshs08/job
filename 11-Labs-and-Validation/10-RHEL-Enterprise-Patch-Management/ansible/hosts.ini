# ==============================================================================
# Inventory: Enterprise RHEL 8.10 Fleet Segmented by Environment Lifecycle
# ==============================================================================

[dev]
rhel-01 ansible_host=127.0.0.1 ansible_port=2201 env_tier=dev
rhel-02 ansible_host=127.0.0.1 ansible_port=2202 env_tier=dev

[preprod]
rhel-03 ansible_host=127.0.0.1 ansible_port=2203 env_tier=preprod
rhel-04 ansible_host=127.0.0.1 ansible_port=2204 env_tier=preprod

[prod]
rhel-05 ansible_host=127.0.0.1 ansible_port=2205 env_tier=prod
rhel-06 ansible_host=127.0.0.1 ansible_port=2206 env_tier=prod

[all:vars]
ansible_user=ansible
ansible_ssh_pass=ansible
ansible_become_pass=ansible

# Snapshot baseline configuration
active_patch_snapshot="2026-10"

# Internal Repo Server IP (accessible from docker network)
repo_server_url="http://172.28.0.10:80/repos/snapshots"

# Minimum free disk space in bytes (2.5 GB)
min_free_space_bytes=2684354560
