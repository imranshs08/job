version: '3.8'

services:
  # -------------------------------------------------------------
  # Internal Frozen Repository Mirror (Simulates Satellite / Pulp)
  # -------------------------------------------------------------
  repo-server:
    image: nginx:alpine
    container_name: repo-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./repo-data:/usr/share/nginx/html/repos:ro
      - ./repo-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      patch_net:
        ipv4_address: 172.28.0.10

  # -------------------------------------------------------------
  # DEV Environment (Week 1 Patch Target)
  # -------------------------------------------------------------
  rhel-01:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: rhel-01
    hostname: rhel-01.dev.internal
    ports:
      - "2201:22"
    networks:
      patch_net:
        ipv4_address: 172.28.0.21

  rhel-02:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: rhel-02
    hostname: rhel-02.dev.internal
    ports:
      - "2202:22"
    networks:
      patch_net:
        ipv4_address: 172.28.0.22

  # -------------------------------------------------------------
  # PREPROD Environment (Mid-Month Patch Target)
  # -------------------------------------------------------------
  rhel-03:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: rhel-03
    hostname: rhel-03.pp.internal
    ports:
      - "2203:22"
    networks:
      patch_net:
        ipv4_address: 172.28.0.31

  rhel-04:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: rhel-04
    hostname: rhel-04.pp.internal
    ports:
      - "2204:22"
    networks:
      patch_net:
        ipv4_address: 172.28.0.32

  # -------------------------------------------------------------
  # PROD Environment (Month-End Patch Target)
  # -------------------------------------------------------------
  rhel-05:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: rhel-05
    hostname: rhel-05.prod.internal
    ports:
      - "2205:22"
    networks:
      patch_net:
        ipv4_address: 172.28.0.41

  rhel-06:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: rhel-06
    hostname: rhel-06.prod.internal
    ports:
      - "2206:22"
    networks:
      patch_net:
        ipv4_address: 172.28.0.42

networks:
  patch_net:
    name: patch_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
