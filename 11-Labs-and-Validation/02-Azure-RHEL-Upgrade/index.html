<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise OS Architect | DevOps Command Center</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Marked.js for dynamic Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(30, 41, 59, 0.7);
            --border-color: rgba(148, 163, 184, 0.1);
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --code-bg: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.15), transparent 25%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: floatIn 0.8s ease-out;
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dynamic Markdown Styles */
        #content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, var(--primary-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.2;
        }

        #content h2 {
            font-size: 1.8rem;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        #content h3 {
            font-size: 1.4rem;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: var(--primary-accent);
        }

        #content p {
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            font-size: 1.05rem;
        }

        #content a {
            color: var(--primary-accent);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        #content a:hover {
            color: var(--secondary-accent);
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        #content ul,
        #content ol {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        #content li {
            margin-bottom: 0.5rem;
        }

        #content blockquote {
            border-left: 4px solid var(--primary-accent);
            background: rgba(30, 41, 59, 0.5);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            border-radius: 0 12px 12px 0;
        }

        #content blockquote.alert-note {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        #content blockquote.alert-warning {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        #content blockquote.alert-caution {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        #content blockquote.alert-tip {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        #content blockquote p {
            margin-bottom: 0;
            color: #e2e8f0;
            font-weight: 400;
        }

        #content pre {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            color: var(--primary-accent);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
        }

        #content pre:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: var(--primary-accent);
            color: var(--bg-color);
        }

        .copy-btn.copied {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        #content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: #38bdf8;
        }

        /* Specifically target code blocks inside pre */
        #content pre code {
            padding: 0;
            background: transparent;
            color: #cbd5e1;
        }

        /* Loading Spinner */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-left-color: var(--primary-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            margin-top: 1rem;
            color: var(--primary-accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .export-pdf-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, var(--primary-accent) 100%);
            color: var(--bg-color);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .export-pdf-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
            }

            .container {
                box-shadow: none !important;
                border: none !important;
                background: white !important;
                padding: 0 !important;
                max-width: 100% !important;
            }

            #content pre,
            #content code {
                border: 1px solid #ccc !important;
                color: #000 !important;
                background: #fdfdfd !important;
            }

            #content a {
                color: #0366d6 !important;
            }

            .no-print {
                display: none !important;
            }

            .copy-btn {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            #content h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Export PDF Button -->
    <button class="export-pdf-btn no-print" onclick="window.print()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        Export PDF
    </button>

    <div class="container">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <div class="loader-text">Fetching Enterprise Telemetry...</div>
        </div>
        <div id="content" style="display: none;"></div>
    </div>

    <script>
        // Use Promise.all to fetch the primary lab guide AND the lifecycle notes asynchronously
        Promise.all([
            fetch('README.md').then(res => res.ok ? res.text() : Promise.reject('Failed to load README.md')),
            fetch('../../04-Notes/rhel-lifecycle.md').then(res => res.ok ? res.text() : Promise.reject('Failed to load rhel-lifecycle.md'))
        ])
            .then(([readmeText, lifecycleText]) => {
                // Concatenate both documents, placing the Lifecycle Theory at the top chronologically
                const fullPayload = lifecycleText + "\n\n<hr style='border:1px solid rgba(0,242,254,0.3); margin: 3rem 0;' />\n\n" + readmeText;

                // Parse unified markdown blob into HTML using marked.js
                document.getElementById('content').innerHTML = marked.parse(fullPayload);

                // Scaffold GFM Alerts (GitHub Flavored Markdown)
                document.querySelectorAll('#content blockquote').forEach(bq => {
                    const firstParagraph = bq.querySelector('p');
                    if (firstParagraph) {
                        const html = firstParagraph.innerHTML;
                        const alertMap = {
                            '[!NOTE]': 'alert-note',
                            '[!WARNING]': 'alert-warning',
                            '[!CAUTION]': 'alert-caution',
                            '[!TIP]': 'alert-tip'
                        };
                        for (const [token, className] of Object.entries(alertMap)) {
                            if (html.includes(token)) {
                                bq.classList.add(className);
                                firstParagraph.innerHTML = html.replace(token, `<strong style="display:block; margin-bottom: 0.5rem; text-transform:uppercase; font-size: 0.85rem; letter-spacing: 1px;">${token.replace(/\[!|\]/g, '')}</strong>`);
                                break;
                            }
                        }
                    }
                });

                // Scaffold dynamic Copy Buttons onto code blocks
                document.querySelectorAll('#content pre').forEach(pre => {
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerText = 'Copy';

                    btn.addEventListener('click', () => {
                        const codeBlock = pre.querySelector('code');
                        if (codeBlock) {
                            navigator.clipboard.writeText(codeBlock.innerText).then(() => {
                                btn.innerText = 'Copied!';
                                btn.classList.add('copied');
                                setTimeout(() => {
                                    btn.innerText = 'Copy';
                                    btn.classList.remove('copied');
                                }, 2000);
                            });
                        }
                    });
                    pre.appendChild(btn);
                });

                // Hide loader and show content
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            })
            .catch(error => {
                console.error('Error fetching markdown modules:', error);
                document.getElementById('loader').innerHTML = `
                <div style="color: #ef4444; font-weight: bold; text-align: center;">
                    ❌ Telemetry Resolution Failure<br>
                    <span style="font-size: 0.9rem; font-weight: 300;">Unable to locate the requisite markdown payload architectures.</span>
                </div>
            `;
            });
    </script>
</body>

</html>
