        let currentVideos = [...allVideos];

        const videoGrid = document.getElementById('videoGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const sortSelect = document.getElementById('sortSelect');
        const videoCount = document.getElementById('videoCount');
        const emptyState = document.getElementById('emptyState');

        function formatNumber(num) {
            if (num === undefined || num === null || num === '') return '0';
            return new Intl.NumberFormat().format(num);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                return new Intl.DateTimeFormat('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                }).format(new Date(dateStr));
            } catch {
                return dateStr;
            }
        }

        function renderVideos() {
            videoGrid.innerHTML = '';
            videoCount.textContent = currentVideos.length;
            
            if (currentVideos.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            currentVideos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'card';

                const title = v["Title"] || 'No Title';
                const url = v["Video url"] || '#';
                const thumb = v["Thumbnail url"] || '';
                const channel = v["ChannelName"] || v["Channel name"] || '';
                const duration = v["DurationTimestamp"] || v["Duration"] || '';
                const views = v["Views"] !== undefined ? v["Views"] : '';
                const likes = v["Likes"] !== undefined ? v["Likes"] : '';
                const comments = v["Comments"] !== undefined ? v["Comments"] : '';
                const uploadedAt = v["UploadedTime"] || v["Uploaded Time"] || v["uploaded_at"] || '';

                card.innerHTML = `
                    <a href="${url}" target="_blank" class="card-thumb-link" title="Play video">
                        ${thumb ? `<img src="${thumb}" alt="${title}" loading="lazy">` : ''}
                        ${duration ? `<span class="card-duration">${duration}</span>` : ''}
                    </a>
                    <div class="card-content">
                        <a href="${url}" target="_blank" class="card-title">${title}</a>
                        <div class="card-channel">${channel}</div>
                        ${uploadedAt ? `<div style="font-size: 0.75rem; color: var(--text-muted); margin-top: -0.25rem;">${formatDate(uploadedAt)}</div>` : ''}
                        <div class="card-stats">
                            ${views !== '' ? `
                                <div class="stat-item" title="Views">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                    ${formatNumber(views)}
                                </div>
                            ` : ''}
                            ${likes !== '' ? `
                                <div class="stat-item" title="Likes">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.708a2 2 0 011.99 2.228l-1 9A2 2 0 0117.708 23H10.5a2 2 0 01-2-2v-7l3-9V2l3 3V10z"></path></svg>
                                    ${formatNumber(likes)}
                                </div>
                            ` : ''}
                            ${comments !== '' ? `
                                <div class="stat-item" title="Comments">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                                    ${formatNumber(comments)}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                videoGrid.appendChild(card);
            });

        }

        function filterAndSort() {
            const query = searchInput.value.toLowerCase();
            const sortVal = sortSelect.value;

            // Filter
            let filtered = allVideos.filter(v => {
                const title = (v["Title"] || '').toLowerCase();
                const channel = (v["ChannelName"] || v["Channel name"] || '').toLowerCase();
                return title.includes(query) || channel.includes(query);
            });

            const getNumeric = (val) => {
                if (val === undefined || val === null || val === '') return 0;
                const parsed = parseInt(String(val).replace(/,/g, ''), 10);
                return isNaN(parsed) ? 0 : parsed;
            };

            // Sort
            if (sortVal === 'title-asc') {
                filtered.sort((a, b) => (a["Title"] || '').localeCompare(b["Title"] || ''));
            } else if (sortVal === 'title-desc') {
                filtered.sort((a, b) => (b["Title"] || '').localeCompare(a["Title"] || ''));
            } else if (sortVal === 'views-desc') {
                filtered.sort((a, b) => getNumeric(b["Views"]) - getNumeric(a["Views"]));
            } else if (sortVal === 'views-asc') {
                filtered.sort((a, b) => getNumeric(a["Views"]) - getNumeric(b["Views"]));
            } else if (sortVal === 'likes-desc') {
                filtered.sort((a, b) => getNumeric(b["Likes"]) - getNumeric(a["Likes"]));
            } else if (sortVal === 'likes-asc') {
                filtered.sort((a, b) => getNumeric(a["Likes"]) - getNumeric(b["Likes"]));
            } else if (sortVal === 'comments-desc') {
                filtered.sort((a, b) => getNumeric(b["Comments"]) - getNumeric(a["Comments"]));
            } else if (sortVal === 'comments-asc') {
                filtered.sort((a, b) => getNumeric(a["Comments"]) - getNumeric(b["Comments"]));
            } else if (sortVal === 'newest') {
                filtered.sort((a, b) => new Date(b["UploadedTime"] || b["Uploaded Time"] || 0) - new Date(a["UploadedTime"] || a["Uploaded Time"] || 0));
            } else if (sortVal === 'oldest') {
                filtered.sort((a, b) => new Date(a["UploadedTime"] || a["Uploaded Time"] || 0) - new Date(b["UploadedTime"] || b["Uploaded Time"] || 0));
            }

            currentVideos = filtered;
            renderVideos();
        }

        searchInput.addEventListener('input', (e) => {
            clearSearch.style.display = e.target.value ? 'block' : 'none';
            filterAndSort();
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            clearSearch.style.display = 'none';
            filterAndSort();
            searchInput.focus();
        });

        sortSelect.addEventListener('change', filterAndSort);

        // Initial render
        renderVideos();
    </script>
